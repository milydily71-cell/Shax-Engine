name: .NET 10 Android build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  dotnet-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install .NET Android workload
        run: dotnet workload install android
      - name: Restore
        run: dotnet restore src/Shax.Android/Shax.Android.csproj
      - name: Build APK
        run: dotnet publish src/Shax.Android/Shax.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk
      - name: Verify APK exists
        run: find src/Shax.Android/bin/Release -type f -name '*.apk' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: shax-engine-dotnet10-android-apk
          path: src/Shax.Android/bin/Release/**/*.apk
          if-no-files-found: error
